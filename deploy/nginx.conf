# devo-site: the site, served to the Cloudflare tunnel only (no port is published on the host).
#   /srv/www/current  the site of the latest release (devo-sync switches the link; old ones stay next to it)
#   /srv/data         the game data pack (game_data.zip), uploaded once by hand: never in git, never touched by sync
# No access log, no metrics. Every answer is `Cache-Control: no-cache` (revalidated by ETag): the page keeps its own
# offline copy (sw.js), and a new release must never be held back by a cache on the way.
server {
    listen 80;
    server_name _;
    root /srv/www/current;
    index index.html;
    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;
    charset utf-8;
    client_max_body_size 1k;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location / {
        include /etc/nginx/snippets/devo_headers.conf;
        try_files $uri $uri/ =404;
    }

    location ~* \.mjs$ {
        include /etc/nginx/snippets/devo_headers.conf;
        default_type text/javascript;
        try_files $uri =404;
    }

    location ~* \.webmanifest$ {
        include /etc/nginx/snippets/devo_headers.conf;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location /data/ {
        include /etc/nginx/snippets/devo_headers.conf;
        alias /srv/data/;
        try_files $uri =404;
    }
}
