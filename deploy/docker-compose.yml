# The Devo's Map Doctor site: three containers on a network of their own, no port published on the host.
#   devo-site    nginx, read-only, serving /opt/devo-site/www/current and /opt/devo-site/data (no access log)
#   devo-sync    puts the site of each new release in place (sync.py: GitHub's public API, the sha256 checked)
#   devo-tunnel  the Cloudflare tunnel of the site's own account: its public hostname points at http://devo-site:80
# The tunnel token goes in .env (TUNNEL_TOKEN=...), next to this file and never in git. See README.md.
name: devo-site

services:
  site:
    image: nginx:1.31-alpine
    container_name: devo-site
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - /opt/devo-site/www:/srv/www:ro
      - /opt/devo-site/data:/srv/data:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./headers.conf:/etc/nginx/snippets/devo_headers.conf:ro
    networks: [devo]

  sync:
    image: python:3.14-alpine
    container_name: devo-sync
    restart: unless-stopped
    read_only: true
    user: "10101:10101"
    environment:
      REPOSITORY: devoltzz/devos-map-doctor
      WWW: /srv/www
      INTERVAL: "900"
      KEEP: "3"
    volumes:
      - /opt/devo-site/www:/srv/www
      - ./sync.py:/app/sync.py:ro
    command: ["python", "-u", "/app/sync.py"]
    networks: [devo]

  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    container_name: devo-tunnel
    restart: unless-stopped
    read_only: true
    # http2 (TCP 443) and not QUIC (UDP 7844): many hosts let no UDP out, and cloudflared then retries QUIC for a while
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on: [site]
    networks: [devo]

networks:
  devo:
    name: devo-site
