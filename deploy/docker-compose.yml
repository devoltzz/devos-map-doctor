# The site's containers: devo-site (nginx), devo-sync and devo-tunnel (Cloudflare).
name: devo-site

services:
  site:
    image: nginx:1.31-alpine
    container_name: devo-site
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - /opt/devo-site/www:/srv/www:ro
      - /opt/devo-site/data:/srv/data:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./headers.conf:/etc/nginx/snippets/devo_headers.conf:ro
    networks: [devo]

  sync:
    image: python:3.14-alpine
    container_name: devo-sync
    restart: unless-stopped
    read_only: true
    user: "10101:10101"
    environment:
      REPOSITORY: devoltzz/devos-map-doctor
      WWW: /srv/www
      INTERVAL: "900"
      KEEP: "3"
    volumes:
      - /opt/devo-site/www:/srv/www
      - ./sync.py:/app/sync.py:ro
    command: ["python", "-u", "/app/sync.py"]
    networks: [devo]

  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    container_name: devo-tunnel
    restart: unless-stopped
    read_only: true
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on: [site]
    networks: [devo]

networks:
  devo:
    name: devo-site
